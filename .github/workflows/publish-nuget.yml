name: Publish to NuGet

# Quarantined: no automatic trigger and no publishing credentials.
# Re-enablement requires separately reviewed trusted provenance + promotion
# of the exact tested artifact by immutable run/head/hash; never repack it.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reject publication until trusted promotion is provisioned
        run: |
          printf '%s\n' 'Publication blocked: authenticated generation/build evidence and exact tested artifact promotion are not provisioned.' >&2
          exit 1
